plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zane.watermarkcamera'
    compileSdk 34

    defaultConfig {
        applicationId "com.zane.watermarkcamera"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
