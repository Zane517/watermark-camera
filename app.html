<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>水印相机</title>
<link rel="stylesheet" href="css/style.css">
<style>
/* App 首页：全屏相机 + 实时水印（与网页版 index.html 分离，水印绘制共用 watermark.js） */
html,body{height:100%;overflow:hidden;background:#000}
body{display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
#viewBox{position:relative;flex:1;overflow:hidden;background:#000}
#video,#shot{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;opacity:0}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;z-index:5}
#top{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;gap:10px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 16px;background:linear-gradient(rgba(0,0,0,.55),transparent);color:#fff}
#clock{font-size:15px;font-weight:600;letter-spacing:.5px;font-variant-numeric:tabular-nums}
.chip{font-size:11px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:none;color:#fff;cursor:pointer;white-space:nowrap}
#bottom{display:flex;align-items:center;justify-content:space-between;padding:14px 22px calc(16px + env(safe-area-inset-bottom));background:#101010}
#shutter{width:72px;height:72px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.4);cursor:pointer;transition:transform .12s var(--ease,cubic-bezier(.2,0,0,1))}
#shutter:active{transform:scale(.9)}
.sbtn{width:56px;height:56px;border-radius:16px;background:#2a2a2a;color:#e8ecf2;border:none;font-size:12px;cursor:pointer;transition:.15s}
.sbtn:active{transform:scale(.94)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20;transition:opacity .4s}
#flash.go{opacity:.92;transition:none}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:25;opacity:0;pointer-events:none;transition:.25s}
#scrim.open{opacity:1;pointer-events:auto}

/* ———— 编辑面板：Miuix / HyperOS 设置式分组 ———— */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg,#242424);color:var(--txt,#f2f2f2);border-radius:28px 28px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.45);transform:translateY(110%);transition:transform .3s var(--ease,cubic-bezier(.2,0,0,1));max-height:84vh;overflow:auto;padding:12px 18px calc(22px + env(safe-area-inset-bottom))}
#sheet.open{transform:none}
.handle{width:36px;height:4px;border-radius:99px;background:var(--line,#393939);margin:2px auto 10px}
.shHead{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 14px}
.shHead h3{font-size:17px;font-weight:600;margin:0}
#closeSheet{background:none;border:none;color:var(--acc,#3482ff);font-size:15px;font-weight:600;padding:6px 4px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mgCap{font-size:12px;font-weight:500;color:var(--mut,#808080);padding:2px 8px 7px}
.mg{background:var(--panel,#2d2d2d);border-radius:20px;overflow:hidden;margin-bottom:16px}
.mrow{display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:52px;position:relative}
.mrow + .mrow::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line,#393939);transform:scaleY(.5)}
.mrow > label{font-size:14.5px;flex-shrink:0;min-width:74px}
.mrow input[type=text]{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--txt,#f2f2f2);font-size:14.5px;padding:2px 0;text-align:right;font-family:inherit}
.mrow input[type=text]::placeholder{color:var(--sub,#666)}
.tbtn{flex-shrink:0;background:rgba(52,130,255,.15);color:var(--acc,#3482ff);border:none;border-radius:99px;padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s var(--ease,cubic-bezier(.2,0,0,1))}
.tbtn:active{transform:scale(.94)}
.mrow .seg{flex:1;max-width:230px;margin-left:auto}
.mrow .switch{margin-left:auto}
</style>
</head>
<body>

<div id="viewBox">
  <video id="video" playsinline autoplay muted></video>
  <img id="shot" alt="">
  <canvas id="overlay"></canvas>
  <div id="top">
    <span id="clock">--:--:--</span>
    <span class="chip" id="locChip">定位中…</span>
    <span style="flex:1"></span>
    <button class="chip" id="editTop">编辑水印</button>
  </div>
  <div id="flash"></div>
</div>

<div id="bottom">
  <button class="sbtn" id="importBtn">导入</button>
  <button id="shutter" aria-label="拍照"></button>
  <button class="sbtn" id="flipBtn">切换</button>
  <button class="sbtn" id="toolBtn">工具</button>
</div>

<div id="scrim"></div>
<div id="sheet">
  <div class="handle"></div>
  <div class="shHead">
    <h3>编辑水印</h3>
    <button id="closeSheet">完成</button>
  </div>

  <div class="mgCap">时间与位置</div>
  <div class="mg">
    <div class="mrow"><label>拍摄时间</label><input type="text" id="fTime"><button class="tbtn" id="nowBtn">现在</button></div>
    <div class="mrow"><label>纬度</label><input type="text" id="fLat" placeholder="自动获取"></div>
    <div class="mrow"><label>经度</label><input type="text" id="fLng" placeholder="自动获取"></div>
    <div class="mrow"><label>地址</label><input type="text" id="fAddr" placeholder="自动获取或手填"><button class="tbtn" id="geoBtn">定位</button></div>
  </div>

  <div class="mgCap">水印信息</div>
  <div class="mg">
    <div class="mrow"><label>拍摄人 / ID</label><input type="text" id="fId" placeholder="请输入姓名或ID"></div>
    <div class="mrow"><label>备注</label><input type="text" id="fMemo" placeholder="例如：例行巡检"></div>
  </div>

  <div class="mgCap">水印样式</div>
  <div class="mg">
    <div class="mrow"><label>风格</label><div class="seg" id="styleSeg"><button data-s="classic" class="on">经典</button><button data-s="clean">简洁</button><button data-s="corner">角落</button></div></div>
    <div class="mrow"><label>中央水印</label><div class="switch on" id="swCenter"></div></div>
    <div class="mrow"><label>经纬地址</label><div class="switch on" id="swGeo"></div></div>
  </div>
</div>

<div id="toast"></div>
<input type="file" id="fileInput" accept="image/*" hidden>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/watermark.js"></script>
<script src="js/appcam.js"></script>
<script src="js/appedit.js"></script>
</body>
</html>
