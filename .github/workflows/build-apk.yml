# 推送 android/ 或网页文件变更时自动构建 APK，产物在 Actions 运行页的 Artifacts 里下载
# 失败时自动开 issue 并附 Gradle 日志尾部，便于通过 API 读取报错原因
name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
      - 'index.html'
      - 'app.html'
      - 'css/**'
      - 'js/**'
      - 'icons/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'version.json'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync web app into APK assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html app.html manifest.webmanifest sw.js version.json android/app/src/main/assets/www/
          cp -r css js icons android/app/src/main/assets/www/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        env:
          GITHUB_TOKEN: }
        run: |
          set -o pipefail
          gradle -p android :app:assembleDebug --no-daemon > build.log 2>&1 || {
            if command -v jq > /dev/null; then
              { echo "## CI Gradle build failed"; echo; echo "commit: "; echo; echo ''; } > /tmp/err.md
              jq -n --rawfile b /tmp/err.md --arg t "CI: Gradle build failed" '{title:,body:}' > /tmp/issue.json
              curl -sS -X POST -H "Authorization: Bearer " -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos//issues" -d @/tmp/issue.json > /dev/null
            fi
            echo "::error::gradle build failed, full log attached to the auto-created issue"
            exit 1
          }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: watermark-camera-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
