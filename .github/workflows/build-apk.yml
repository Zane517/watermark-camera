# 推送 android/ 或网页文件变更时自动构建 APK，产物在 Actions 运行页的 Artifacts 里下载
# 失败诊断：环境探测 + 错误摘要写入 commit status（API 可读），完整日志尾部自动开 issue
name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
      - 'index.html'
      - 'app.html'
      - 'css/**'
      - 'js/**'
      - 'icons/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'version.json'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync web app into APK assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html app.html manifest.webmanifest sw.js version.json android/app/src/main/assets/www/
          cp -r css js icons android/app/src/main/assets/www/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          ENVDESC="sdk=${ANDROID_HOME:-none}|sdkdir=$(test -d /usr/local/lib/android/sdk && echo yes || echo no)|$(java -version 2>&1 | head -1 | tr -d '"' | tr '\n' ' ')"
          ENVDESC=$(printf '%s' "$ENVDESC" | tr -d '"\\' | cut -c1-130)
          curl -sS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"success\",\"context\":\"env-check\",\"description\":\"$ENVDESC\"}" > /dev/null

          gradle -p android :app:assembleDebug --no-daemon > build.log 2>&1 || {
            ERR1=$(grep -m1 -A2 "What went wrong" build.log | tr '\n' ' ' | tr -d '"\\' | cut -c1-130)
            ERR2=$(grep -E "error:|Execution failed|Could not|Caused by|FAILURE" build.log | tail -6 | tr '\n' ' ' | tr -d '"\\' | cut -c1-130)
            for P in "gradle-error-task|$ERR1" "gradle-error-detail|$ERR2"; do
              CTX="${P%%|*}"; DESC="${P#*|}"
              curl -sS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
                -d "{\"state\":\"failure\",\"context\":\"$CTX\",\"description\":\"$DESC\"}" > /dev/null
            done
            if command -v jq > /dev/null; then
              { echo "## CI Gradle build failed"; echo; echo "commit: $GITHUB_SHA"; echo; echo '```'; tail -n 120 build.log; echo '```'; } > /tmp/err.md
              jq -n --rawfile b /tmp/err.md --arg t "CI: Gradle build failed" '{title:$t,body:$b}' > /tmp/issue.json
              curl -sS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/issues" -d @/tmp/issue.json > /dev/null
            fi
            echo "::error::gradle failed, see env-check/gradle-error statuses"
            exit 1
          }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: watermark-camera-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
